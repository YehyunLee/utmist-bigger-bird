<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bigger Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fg:#111418; --muted:#6b7280; --accent:#1f4fd8; --good:#1a7f37; --bad:#cf222e;
          --g:#a8d5a2; --b:#a9c4f5; --o:#f7c48f; --p:#b9a6dc; --r:#e06666; --y:#fde49c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#eceef1; color:var(--fg);
               font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .slide { display:none; position:absolute; inset:0; margin:auto; width:min(96vw, 170vh); height:min(54vw, 96vh);
           background:#fff; padding:5% 8%; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden;
           flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .slide.active { display:flex; }
  .say { font-size:3.3vw; font-weight:700; line-height:1.25; letter-spacing:-.015em; margin:0; max-width:90%; }
  .sub { font-size:1.6vw; color:var(--muted); margin:.9em 0 0; max-width:85%; line-height:1.4; }
  .slide img { max-width:100%; max-height:62vh; object-fit:contain; }
  .k-img .say { font-size:2.4vw; margin-top:.6em; }
  .k-photo img { border-radius:12px; max-height:64vh; }
  .k-section .say { font-size:4.4vw; font-weight:800; color:var(--accent); }
  .secnum { display:block; font-size:1.3vw; font-weight:700; color:#9aa3b2; letter-spacing:.28em; margin-bottom:1em; }
  .num { font-size:9vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .corner { position:absolute; top:4%; right:4%; height:7%; max-height:none !important; }
  .footer { position:absolute; bottom:2.5%; right:4%; font-size:.9vw; color:var(--muted); }

  /* Title */
  .k-hero .row { display:flex; align-items:center; gap:3.5vw; position:absolute; top:30%; left:50%; transform:translateX(-50%); }
  .k-hero .row img { max-height:23vh; }
  .k-hero .big { font-size:5.5vw; font-weight:800; letter-spacing:-.02em; line-height:1.1; text-align:left; white-space:nowrap; }
  .k-hero .small { font-size:2.1vw; font-weight:500; color:var(--muted); margin-top:.5em; text-align:left; }
  .k-hero .say { position:absolute; top:68%; left:8%; right:8%; margin:0; }

  /* Stage: visual stays fixed in the middle, the sentence changes at the bottom */
  .stage .vis { position:absolute; top:7%; bottom:27%; left:6%; right:6%;
                display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage .vis > img { max-height:100%; max-width:100%; }
  .stage .cap { position:absolute; top:76%; left:7%; right:7%; display:flex; flex-direction:column; align-items:center; }
  .stage .cap .say { font-size:2.6vw; max-width:100%; }
  .stage .cap .sub { font-size:1.4vw; margin-top:.5em; }

  /* Tokens */
  .toks { display:flex; gap:.6vw; flex-wrap:wrap; justify-content:center; }
  .tok { font-size:2.4vw; font-weight:600; padding:.35em .6em; border-radius:.4em; border:2px solid #d8dde3; background:#fff; }
  .tok.back { background:#e8efff; border-color:var(--b); }
  .tok.cur { background:var(--accent); border-color:var(--accent); color:#fff; }
  .toknote { font-size:1.4vw; color:var(--muted); margin-top:1.2em; }

  /* Attention formula */
  .formula { font-family: "Times New Roman", Georgia, serif; font-size:3.2vw; margin-bottom:.9em; }
  .formula .qc { color:#b8860b; font-style:italic; } .formula .kc { color:#0f8f8f; font-style:italic; }
  .vecs { display:flex; gap:3vw; }
  .vec { border:3px solid; border-radius:10px; padding:.5em .9em; font-family:"Times New Roman", Georgia, serif;
         font-style:italic; font-size:2.3vw; word-spacing:.45em; }
  .vec.vq { border-color:#e0b400; color:#b8860b; } .vec.vk { border-color:#2bb3b3; color:#0f8f8f; }
  .vec sub { font-size:.6em; letter-spacing:0; }

  /* Growth animation */
  .quadcv { height:100%; max-height:44vh; aspect-ratio: 660 / 480; }
  .quadlab { font-size:1.9vw; font-weight:600; color:var(--muted); margin-top:.3em; }
  .quadlab b { color:var(--accent); font-weight:800; }

  /* Model chips */
  .chips { display:flex; flex-wrap:wrap; gap:1vw; justify-content:center; max-width:80%; }
  .chip { font-size:2vw; font-weight:700; padding:.45em .9em; border-radius:999px; background:#f2f4f7; }
  .chip.hl { background:var(--accent); color:#fff; }

  /* Big Bird grids */
  .bbrow { display:flex; align-items:center; gap:1.6vw; }
  .bbp { display:flex; flex-direction:column; align-items:center; transition:opacity .2s; }
  .bbp.off, .op.off { opacity:.12; }
  .grid { display:grid; grid-template-columns:repeat(10, 1fr); gap:2px; width:15vw; }
  .grid i { aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .grid i.g { background:var(--g); border-color:#86c07f; } .grid i.b { background:var(--b); border-color:#7fa6ee; }
  .grid i.o { background:var(--o); border-color:#eba25c; }
  .bbp b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.7em; }
  .op { font-size:3vw; font-weight:800; color:#7fa6ee; }

  /* Window strips */
  .strip { display:flex; gap:3px; }
  .strip i { width:2.4vw; aspect-ratio:1; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; }
  .strip i.y { background:var(--y); border-color:#efc95a; } .strip i.p { background:var(--p); border-color:#9a83c8; }
  .strip i.r { background:var(--r); border-color:#c94a4a; } .strip i.g { background:var(--g); border-color:#86c07f; }
  .strip i.b { background:var(--b); border-color:#7fa6ee; } .strip i.q { background:#3a3f4a; border-color:#3a3f4a; }
  .strip i.cur { outline:3px solid var(--r); outline-offset:1px; }
  .wrow { display:flex; flex-direction:column; align-items:center; margin:.9em 0; transition:opacity .2s; }
  .wrow.off { opacity:.3; }
  .wrow b { font-family: ui-monospace, Menlo, monospace; font-weight:500; font-size:1.3vw; margin-top:.5em; }
  .legend { display:flex; gap:2vw; margin-top:1.6em; }
  .legend span { font-size:1.35vw; display:flex; align-items:center; gap:.5em; transition:opacity .2s; }
  .legend span.off { opacity:.15; }
  .legend i { width:1.4vw; height:1.4vw; border-radius:3px; display:inline-block; }

  .strip i.e { border-color:#3a3f4a; border-width:2.5px; } .strip i.all { background:#e3e6ec; border-color:#cfd3da; }

  /* Routing scan: how the end picks spots */
  .rtrow { display:flex; gap:3px; align-items:flex-end; }
  .rtcol { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:9.5vw; gap:5px; }
  .rtcol .bar { width:1.1vw; border-radius:2px 2px 0 0; background:#c9ced6; transition:opacity .25s; }
  .rtcol .bar.win { background:var(--p); }
  .rtcol .bar.off2 { opacity:0; }
  .rtcol .cell { width:2.4vw; height:2.4vw; border:1.5px solid #c9ced6; border-radius:2px; background:#fff; transition:background .25s; }
  .rtcol .cell.e { border-color:#3a3f4a; border-width:2.5px; }
  .rtcol .cell.p { background:var(--p); border-color:#9a83c8; }
  .rtcol .cell.r { background:var(--r); border-color:#c94a4a; }
  .rtcol .cell.cur { outline:3px solid var(--r); outline-offset:1px; }

  /* Fixed window vs document length */
  .scwrap { display:flex; flex-direction:column; gap:1.5vw; width:96%; }
  .scrow { display:flex; align-items:center; gap:1.2vw; transition:opacity .25s; }
  .scrow.off { opacity:.12; }
  .sclab { width:7.5vw; text-align:right; font-size:1.25vw; font-weight:600; color:var(--muted); }
  .scbar { height:1.9vw; background:#eef0f3; border-radius:.45vw; position:relative; }
  .scwin { position:absolute; right:0; top:0; bottom:0; width:1.28vw; background:var(--b); border-radius:0 .45vw .45vw 0;
           font-style:normal; font-size:.85vw; font-weight:800; color:#fff; display:flex; align-items:center; justify-content:center; }
  .scnote { font-family:ui-monospace, Menlo, monospace; font-size:1.15vw; color:var(--muted); margin-top:.6vw; }

  /* Quadratic vs linear growth chart */
  .expl svg { width:min(82vw, 1000px); }
  .expl .cur { transition:opacity .25s; } .expl .cur.off { opacity:.15; }

  /* Struggle wall */
  .wall { display:grid; grid-template-columns:repeat(5, 1fr); gap:.7vw; width:100%; }
  .wt { border:2px solid #e1e4ea; border-radius:.8vw; padding:.55em .5em; text-align:left; background:#fff; transition:opacity .25s, background .25s, border-color .25s; }
  .wt b { display:block; font-size:.95vw; color:var(--muted); font-weight:700; }
  .wt span { display:block; font-size:1.15vw; font-weight:600; line-height:1.25; margin-top:.15em; }
  .wt.dim { opacity:.3; }
  .wt.hi { background:#eef3ff; border-color:var(--accent); } .wt.hi b { color:var(--accent); }
  .wt.last { background:var(--accent); border-color:var(--accent); color:#fff; } .wt.last b { color:#cfdcff; }

  /* Stats */
  .stats { display:flex; gap:3.5vw; justify-content:center; }
  .stat { text-align:center; transition:opacity .25s; }
  .stat.off { opacity:.12; }
  .stat .sn { font-size:7vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .stat .sl { font-size:1.4vw; color:var(--muted); font-weight:600; margin-top:.4em; max-width:14vw; }

  /* Scoreboard */
  .board { border-collapse:collapse; font-size:1.55vw; }
  .board th { font-size:1.1vw; color:var(--muted); font-weight:600; text-align:left; padding:.4em 1.2em; }
  .board td { padding:.55em 1.2em; border-top:1px solid #eef0f3; text-align:left; font-weight:600; }
  .board td.n { text-align:center; font-weight:800; }
  .board .bad { color:var(--bad); } .board .good { color:var(--good); }
  .board small { font-weight:500; color:var(--muted); font-size:.75em; }
  .board tr.off { opacity:.12; }

  /* Test examples */
  .exbox .prompt { font-size:1.25vw; max-width:100%; }
  .extag { font-size:1.2vw; font-weight:700; color:var(--accent); margin-bottom:.25em; text-transform:uppercase; letter-spacing:.07em; }
  .exrule { font-size:.95vw; color:var(--muted); font-family:ui-monospace,monospace; margin-bottom:1.1em; }

  /* Prompt boxes */
  .prompt { font-family: ui-monospace, Menlo, monospace; font-size:1.35vw; line-height:1.6; text-align:left;
            background:#f7f8fa; border:1px solid #d8dde3; border-radius:12px; padding:1em 1.3em; max-width:92%;
            white-space:pre-wrap; }
  .needle { background:#fff3b0; font-weight:700; } .q { background:#dbe7ff; font-weight:700; }
  .dim { color:var(--muted); }

  /* Timeline */
  .timeline { display:flex; position:absolute; top:14%; left:8%; right:8%; }
  .tl { flex:1; border-top:5px solid var(--accent); padding:.7em .6em 0 0; text-align:left; }
  .tl b { display:block; font-size:1.35vw; } .tl span { font-size:1.15vw; color:var(--muted); line-height:1.35; display:block; }
  .tl.off { border-top-color:#dfe3ea; } .tl.off b, .tl.off span { opacity:.3; }
  .tl.on b { color:var(--accent); }

  /* Reading list */
  .readlist { column-count:2; column-gap:4vw; text-align:left; width:94%; }
  .readlist div { break-inside:avoid; font-size:1.45vw; font-weight:600; padding:.4em 0; border-bottom:1px solid #eef0f3; }
  .readlist span { display:block; font-size:1.05vw; font-weight:400; color:var(--muted); margin-top:.15em; }

  /* People / partners */
  .ptitle { font-size:3.4vw; font-weight:800; color:var(--accent); margin:0 0 1em; letter-spacing:-.015em; }
  .pgrid { display:flex; gap:3vw; align-items:stretch; justify-content:center; width:100%; }
  .pgrid .p { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .pgrid .pimg { height:17vh; display:flex; align-items:center; justify-content:center; }
  .pgrid .plogo { max-height:17vh; max-width:100%; }
  .face { width:17vh; height:17vh; border-radius:50%; object-fit:cover; object-position:center 30%; max-height:none !important; }
  .initial { width:17vh; height:17vh; border-radius:50%; background:#e8edfb; color:var(--accent);
             font-size:8vh; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .pgrid .pname { font-size:1.7vw; font-weight:800; margin:.7em 0 0; }
  .pgrid .prole { font-size:1.2vw; font-weight:700; color:var(--accent); margin:.25em 0 0; text-transform:uppercase; letter-spacing:.06em; }
  .pgrid .pcap { font-size:1.2vw; color:var(--muted); margin:.4em 0 0; line-height:1.35; }
  .pgrid ul { list-style:none; padding:0; margin:.6em 0 0; }
  .pgrid li { font-size:1.15vw; color:var(--muted); line-height:1.4; margin:.3em 0; }

  /* Bento: everything in one view */
  .bento { position:absolute; inset:5% 3.5%; display:grid; grid-template-columns:repeat(5, 1fr);
           grid-template-rows:repeat(3, 1fr); gap:1vw; }
  .tile { background:#f5f5f7; border-radius:1.4vw; padding:1vw; display:flex; flex-direction:column;
          justify-content:center; align-items:center; text-align:center; overflow:hidden; }
  .tile .tn { font-size:3.4vw; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .tile .tt { font-size:1.1vw; font-weight:600; margin-top:.55em; line-height:1.3; }
  .tile .ts { font-size:.95vw; color:var(--muted); margin-top:.3em; }
  .tile.blue { background:var(--accent); color:#fff; } .tile.blue .ts { color:#d6e0ff; }
  .tile.dark { background:#111418; color:#fff; } .tile.dark .ts { color:#9aa3b2; }
  .tile.center { grid-column:2 / 5; grid-row:1 / 3; background:#fff; border:1px solid #e6e8ec; }
  .tile.center img { max-height:22vh; }
  .tile.center .cn { font-size:4.6vw; font-weight:800; letter-spacing:-.02em; margin-top:.2em; }
  .tile.center .cs { font-size:1.6vw; color:var(--muted); margin-top:.2em; }
  .tile.chart { grid-column:2 / 4; padding:.6vw; background:#fff; border:1px solid #e6e8ec; }
  .tile.chart img { max-height:100%; max-width:100%; }
</style>
</head>
<body>
<div id="deck"></div>
<div class="footer"><span id="num"></span></div>
<script>
// Each entry is one slide.
//   kind: hero | section | num | photo | img | timeline | readlist | team | partners | bento | (default: one sentence)
//   vis:  a visual that stays fixed in the middle while `say` changes at the bottom (see VIS below)
//   say = the one sentence on screen; sub = optional small line under it.
const F = "../figures/", A = "assets/";
const S = [
  {kind: "hero", corner: true},
  {kind: "hero", say: "An LLM that can scale efficiently to longer context windows.", corner: true},
  {img: A + "utmist_logo.png", kind: "img", say: "A UTMIST research project"},

  {kind: "section", say: '<span class="secnum">PART 1</span>The problem'},
  {vis: "tokens", step: 0, say: "AI language models read text as small pieces called tokens."},
  {vis: "tokens", step: 1, say: "To understand each token, the model looks back at every token before it."},
  {vis: "attn", say: "This looking-back step is called attention.", sub: "every token's query (Q) is compared with every earlier token's key (K)"},
  {vis: "quad", say: "Watch what happens as the context window grows."},
  {vis: "quad", say: "Double the context window, and attention does four times the work."},
  {kind: "num", num: "8 billion", say: "comparisons for one 128,000-token document", sub: "per attention head, and the model has 1,024 of them"},
  {vis: "expl", say: "That's why long documents are slow and expensive.", sub: "a sparse design should grow subquadratically instead"},

  {kind: "section", say: '<span class="secnum">PART 2</span>The idea'},
  {say: "What if each token only looked at what matters?"},
  {vis: "models", say: "That's the idea behind sparse attention.", sub: "only a few tokens matter for understanding any one token"},
  {vis: "models", hl: true, say: "Many faster-attention designs exist. We started from Big Bird."},
  {vis: "bb", step: 1, say: "Big Bird mixes three fixed patterns. First: a few global tokens everyone sees."},
  {vis: "bb", step: 2, say: "Second: the nearby text."},
  {vis: "bb", step: 3, say: "Third: a few random spots."},
  {vis: "bb", step: 4, say: "Together: the same fixed shape, whatever the text says."},
  {vis: "win", step: 1, say: "Big Bird's window takes everything nearby."},
  {vis: "win", step: 2, say: "Bigger Bird chooses where to look, based on what it needs to answer."},

  {kind: "section", say: '<span class="secnum">PART 3</span>Evaluation'},
  {say: "Any token selector can skip tokens. The question is whether it picks the important ones."},
  {vis: "prompt", say: "So we hide one fact inside a huge document, then ask for it."},
  {vis: "prompt", say: "If our shortcut skips that fact, the model can't answer."},
  {vis: "prompt", say: "It only counts if the whole 7-digit number is right."},
  {vis: "prompt", say: "We compare against the normal model, on the exact same documents."},
  {say: "We also time how long each model takes to read the document.", sub: "same GPU, same settings, one H100"},
  {say: "The normal model uses FlashAttention, the fast standard version."},
  {say: "We run 30 different documents at 128,000 tokens."},
  {say: "Six were used to tune our method. The other 24 were never touched."},

  {kind: "section", say: "<span class='secnum'>PART 4</span>What didn't work"},
  {vis: "wall", step: 0, say: "We tried 19 different designs."},
  {vis: "wall", step: 1, say: "The first fifteen ran on small models, on small tests."},
  {vis: "wall", step: 2, say: "Then we moved to a modern model and a much harder test."},
  {vis: "stats", step: 1, say: "19 designs."},
  {vis: "stats", step: 2, say: "Our results folder holds about 1,700 saved runs.", sub: "each file is one benchmark run, timestamped"},
  {vis: "stats", step: 3, say: "Plus 86 more recorded runs on Modal."},
  {vis: "stats", step: 4, say: "And about 290 saved versions of the code along the way."},
  {say: "For months, every fully sparse version failed on long documents."},
  {say: "They worked at 65,000 tokens.", sub: "about a 200-page book"},
  {say: "They broke at 128,000 tokens.", sub: "about 400 pages: the most this model can read"},
  {vis: "board", step: 1, say: "Every fully sparse version scored 0 or 1 out of 6 at 128,000 tokens."},
  {vis: "board", step: 2, say: "Keeping the first 16 layers normal fixed it, but that is still quadratic."},
  {say: "So we tried cheating: we forced the fact into view at every layer."},
  {say: "It still failed. The model could see the fact but not use it."},
  {vis: "img", img: F + "recall_layers.png", say: "To see why, we checked what each layer shows a token in the middle of the document.", sub: "for each of the 32 layers: how similar the token's view is to the normal model's"},
  {vis: "img", img: F + "recall_layers.png", say: "Higher means closer to the normal model; 1.0 would be identical."},
  {vis: "img", img: F + "recall_layers.png", say: "The earlier shortcuts (blue, orange) lose 10 to 25 percent of the view in most layers.", sub: "and every layer feeds the next, so small losses pile up across all 32"},
  {vis: "img", img: F + "recall_layers.png", say: "Red is the best any shortcut could do: it cheats and picks the true best spots."},
  {vis: "img", img: F + "recall_layers.png", say: "An early version of Bigger Bird (green) stays close to that ceiling in all 32 layers."},
  {say: "The solution: let the tokens near the prediction score which far-away spots matter.", sub: "we call this routing: attention picks where attention looks"},

  {kind: "section", say: '<span class="secnum">PART 5</span>Our fix'},
  {vis: "fix", step: 0, say: "Every token looks at three things, with one exception."},
  {vis: "fix", step: 1, say: "One: the very beginning of the document."},
  {vis: "fix", step: 2, say: "Two: the nearby text, in full detail."},
  {vis: "fix", step: 3, say: "Three: a few hundred spots that matter for the answer."},
  {vis: "fix", step: 4, say: "The exception: the last 256 tokens, the ones about to predict, see everything.", sub: "full detail for their own view, no skipping"},
  {vis: "route", step: 1, say: "Those same tokens do a second job: the last 64 of them score every earlier spot.", sub: "one score per spot: how much attention the end gives it"},
  {vis: "route", step: 2, say: "Each attention head keeps its top 512 spots.", sub: "32 heads in each of 32 layers, each with its own list"},
  {vis: "route", step: 3, say: "Every token can then use those spots.", sub: "the quick look touches each spot once, so it stays cheap"},
  {say: "Why the end? Those tokens are about to predict, so their attention shows what the prediction needs."},
  {kind: "num", num: "1 in 4", say: "heads put the hidden number on their list", sub: "a random selector would find it in almost none"},
  {say: "Does the question have to be at the end?", sub: "every test so far put it there"},
  {kind: "num", num: "6 / 6", say: "with the question moved near the start", sub: "5 of 6 when it is the very first line · same 6 documents, still about 2× faster · a quick check, not a full test yet"},
  {say: "Why? Every answer is written starting from the end.", sub: "so the end is where the model needs the clearest view"},
  {say: "The end reads everything, including the question, wherever it is."},
  {say: "So it knows what to look for, and picks the spots that hold the answer."},
  {vis: "img", img: F + "ablations.png", say: "Two dials decided everything. Left: how many spots each head keeps."},
  {vis: "img", img: F + "ablations.png", say: "Too few, and the fact gets skipped: 0 of 6 at 64 spots."},
  {vis: "img", img: F + "ablations.png", say: "But more is not better. Thousands of spots dilute the signal.", sub: "best at a few hundred; only 3 of 6 with 4,000"},
  {vis: "img", img: F + "ablations.png", say: "Right: how many positions about to predict read everything.", sub: "none → 2 of 6 · a little → 4 of 6 · 256 tokens → 6 of 6"},
  {vis: "img", img: F + "ablations.png", say: "No retraining. Same model, same weights."},

  {kind: "section", say: '<span class="secnum">PART 6</span>Results'},

  route: s => {

    }).join("") + [0, 1, 2].map(() =>

    const L = [
      ["#fff;border:2.5px solid #3a3f4a", "about to predict (last 64 tokens)", 0],
      ["#c9ced6;height:.55vw", "a score per earlier spot", 1],
      ["var(--p)", "top 512, kept", 2],

      `<circle cx="${x(N)}" cy="${y(N * N / 2)}" r="6" fill="#1f4fd8"/>` +
      `<text x="${x(N) - 14}" y="${y(N * N / 2) - 14}" font-size="19" font-weight="700" fill="#1f4fd8" text-anchor="end">550 billion (1M)</text>`;
    const linlab = `<text x="${x(524288)}" y="${y(524288 * 16960) - 14}" font-size="19" font-weight="700" fill="#57a04e" text-anchor="middle">Bigger Bird, linear in theory</text>`;
    return `<div class="expl"><svg viewBox="0 0 ${W} ${H + 40}">
      <line x1="${pad}" y1="${H - pad}" x2="${W - 20}" y2="${H - pad}" stroke="#8a93a3" stroke-width="2"/>
      <line x1="${pad}" y1="${H - pad}" x2="${pad}" y2="20" stroke="#8a93a3" stroke-width="2"/>
      <text x="18" y="${(H - pad) / 2}" font-size="17" fill="#8a93a3" transform="rotate(-90 18 ${(H - pad) / 2})" text-anchor="middle">comparisons</text>${ticks}${here}
      <polyline points="${quad.join(" ")}" fill="none" stroke="#1f4fd8" stroke-width="4"/>
      <polyline points="${lin.join(" ")}" fill="none" stroke="#57a04e" stroke-width="4" stroke-dasharray="9 6"/>${linlab}
    </svg></div>`;

      : b.cls === "chart" ? `<div class="tile chart"><img src="${b.img}" alt=""></div>`
      : `<div class="tile ${b.cls || ""}"><div class="tn">${b.n}</div><div class="tt">${b.t}</div>${b.s ? `<div class="ts">${b.s}</div>` : ""}</div>`).join("") + `</div>`;
  } else {
    if (s.kind === "timeline")
      html += `<div class="timeline">${TIMELINE.map(([d, t], j) =>
        `<div class="tl${s.tl === undefined ? "" : j === s.tl ? " on" : " off"}"><b>${d}</b><span>${t}</span></div>`).join("")}</div>`;
    if (s.kind === "hero")
      html += `<div class="row"><img src="${A}bigger_bird_logo.png" alt="Bigger Bird"><div><div class="big">Bigger Bird</div><div class="small">Content-Aware Sparse Transformer Attention</div></div></div>`;
    if (s.kind === "readlist")
      html += `<p class="say" style="margin:0 0 .9em">${s.say}</p><div class="readlist">` +
              READLIST.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
    if (s.kind === "team")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + TEAM.map(p =>
        `<div class="p"><div class="pimg">${face(p, "face")}</div><p class="pname">${p.name}</p><p class="prole">${p.role}</p>` +
        `<ul>${p.pts.map(t => `<li>${t}</li>`).join("")}</ul></div>`).join("") + `</div>`;
    if (s.kind === "partners")
      html += `<p class="ptitle">${s.say}</p><div class="pgrid">` + PARTNERS.map(p =>
        `<div class="p"><div class="pimg">${face(p, p.round || p.initial ? "face" : "plogo")}</div>` +
        `${p.name ? `<p class="pname">${p.name}</p>` : ""}<p class="pcap">${p.cap}</p></div>`).join("") + `</div>`;
    if (s.img && !["partners", "team"].includes(s.kind)) html += `<img src="${s.img}" alt="">`;
    if (s.kind === "num") html += `<div class="num">${s.num}</div>`;
    if (s.say && !["readlist", "team", "partners"].includes(s.kind)) html += `<p class="say">${s.say}</p>`;
    if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  }
  el.innerHTML = html;
  deck.appendChild(el);
});

// Growth animation: n tokens double each cycle; the triangle of comparisons fills in.
document.querySelectorAll(".quadcv").forEach(cv => {
  const lab = cv.parentElement.querySelector(".quadlab"), ctx = cv.getContext("2d");
  const seq = [8, 16, 32, 64, 128];
  function draw() {
    const t = performance.now() / 2400;
    const n = seq[Math.floor(t) % seq.length];
    const lim = Math.ceil(Math.min(1, (t % 1) * 2.2) * n * (n + 1) / 2);
    const size = 430, mx = (660 - size) / 2, my = 18, cs = size / n;
    ctx.clearRect(0, 0, 660, 480);
    ctx.fillStyle = "#1f4fd8";
    let drawn = 0;
    for (let r = 0; r < n && drawn < lim; r++)
      for (let c = 0; c <= r && drawn < lim; c++, drawn++)
        ctx.fillRect(mx + c * cs, my + r * cs, Math.max(1, cs - 0.6), Math.max(1, cs - 0.6));
    lab.innerHTML = `<b>${n}</b> tokens → <b>${(n * (n + 1) / 2).toLocaleString()}</b> comparisons`;
    requestAnimationFrame(draw);
  }
  draw();
});

const slides = [...document.querySelectorAll(".slide")];
let i = Math.max(0, Math.min(slides.length - 1, parseInt(location.hash.slice(1) || "1") - 1));
const show = () => { slides.forEach((s, j) => s.classList.toggle("active", j === i));
                     document.getElementById("num").textContent = `${i + 1} / ${slides.length}`; location.hash = i + 1; };
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) i = Math.max(0, i - 1);
  show();
});
document.addEventListener("click", e => { i = e.clientX > innerWidth / 2 ? Math.min(slides.length - 1, i + 1) : Math.max(0, i - 1); show(); });
show();
</script>
</body>
</html>
