<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bigger Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --fg:#111418; --muted:#6b7280; --accent:#1f4fd8; --good:#1a7f37; --bad:#cf222e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#eceef1; color:var(--fg);
               font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .slide { display:none; position:absolute; inset:0; margin:auto; width:min(96vw, 170vh); height:min(54vw, 96vh);
           background:#fff; padding:5% 8%; box-shadow:0 8px 30px rgba(0,0,0,.12); overflow:hidden;
           flex-direction:column; justify-content:center; align-items:center; text-align:center; }
  .slide.active { display:flex; }
  .say { font-size:3.3vw; font-weight:700; line-height:1.25; letter-spacing:-.015em; margin:0; max-width:90%; }
  .k-img .say { font-size:2.4vw; margin-top:.6em; }
  .k-hero .row { display:flex; align-items:center; gap:3.5vw; position:absolute; top:20%; left:50%; transform:translateX(-50%); }
  .k-hero .row img { max-height:23vh; }
  .k-hero .big { font-size:5.5vw; font-weight:800; letter-spacing:-.02em; line-height:1.1; text-align:left; }
  .k-hero .small { font-size:2.1vw; font-weight:500; color:var(--muted); margin-top:.5em; text-align:left; }
  .k-hero .say { position:absolute; top:60%; left:8%; right:8%; margin:0; }
  .k-section .say { font-size:4.4vw; font-weight:800; color:var(--accent); }
  .sub { font-size:1.6vw; color:var(--muted); margin:.9em 0 0; max-width:85%; line-height:1.4; }
  .num { font-size:9vw; font-weight:800; color:var(--accent); line-height:1; letter-spacing:-.03em; }
  .slide img { max-width:100%; max-height:62vh; object-fit:contain; }
  .k-photo img { border-radius:12px; max-height:64vh; }
  .good { color:var(--good); } .bad { color:var(--bad); } .accent { color:var(--accent); }
  .prompt { font-family: ui-monospace, Menlo, monospace; font-size:1.35vw; line-height:1.6; text-align:left;
            background:#f7f8fa; border:1px solid #d8dde3; border-radius:12px; padding:1em 1.3em; max-width:92%;
            white-space:pre-wrap; }
  .needle { background:#fff3b0; font-weight:700; } .q { background:#dbe7ff; font-weight:700; }
  .dim { color:var(--muted); }
  .timeline { display:flex; width:100%; margin-bottom:1.6em; }
  .k-timeline .timeline { position:absolute; top:14%; left:8%; right:8%; width:auto; }
  .tl { flex:1; border-top:5px solid var(--accent); padding:.7em .6em 0 0; text-align:left; }
  .tl b { display:block; font-size:1.35vw; } .tl span { font-size:1.15vw; color:var(--muted); line-height:1.35; display:block; }
  .tl.off { border-top-color:#dfe3ea; } .tl.off b, .tl.off span { opacity:.3; }
  .tl.on b { color:var(--accent); }
  .readlist { column-count:2; column-gap:4vw; text-align:left; width:94%; }
  .readlist div { break-inside:avoid; font-size:1.45vw; font-weight:600; padding:.4em 0;
                  border-bottom:1px solid #eef0f3; }
  .readlist span { display:block; font-size:1.05vw; font-weight:400; color:var(--muted); margin-top:.15em; }
  .ptitle { font-size:3.4vw; font-weight:800; color:var(--accent); margin:0 0 1em; letter-spacing:-.015em; }
  .pgrid { display:flex; gap:3vw; align-items:stretch; justify-content:center; width:100%; }
  .pgrid .p { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .pgrid .pimg { height:17vh; display:flex; align-items:center; justify-content:center; }
  .pgrid .plogo { max-height:17vh; max-width:100%; }
  .pgrid .face { width:17vh; height:17vh; border-radius:50%; object-fit:cover; max-height:none; }
  .pgrid .initial { width:17vh; height:17vh; border-radius:50%; background:#e8edfb; color:var(--accent);
                    font-size:8vh; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .pgrid .pname { font-size:1.7vw; font-weight:800; margin:.7em 0 0; }
  .pgrid .pcap { font-size:1.2vw; color:var(--muted); margin:.4em 0 0; line-height:1.35; }
  .ov { text-align:left; width:78%; }
  .ov .oi { display:flex; gap:1.2em; align-items:baseline; padding:.45em 0; border-bottom:1px solid #eef0f3; }
  .ov .n { color:var(--accent); font-weight:800; font-size:1.6vw; min-width:2.6em; }
  .ov .t { font-size:2.2vw; font-weight:700; }
  .ov .d { font-size:1.3vw; color:var(--muted); margin-left:auto; padding-left:1em; }
  .corner { position:absolute; top:4%; right:4%; height:7%; max-height:none !important; }
  .footer { position:absolute; bottom:2.5%; right:4%; font-size:.9vw; color:var(--muted); }
</style>
</head>
<body>
<div id="deck"></div>
<div class="footer"><span id="num"></span></div>
<script>
// Each entry is one slide. kind: section | img | photo | num | (default text).
// say = the one sentence on screen; sub = optional small line under it.
const F = "../figures/", A = "assets/";
const S = [
  {kind: "hero", corner: true},
  {kind: "hero", say: "An LLM that can scale efficiently to longer context windows.", corner: true},
  {img: A + "utmist_logo.png", kind: "img", say: "A UTMIST research project"},
  {kind: "agenda", say: "Overview"},
  {say: "Today, here's what we found."},

  {kind: "section", say: "The problem"},
  {say: "AI language models read text as small pieces called tokens."},
  {say: "To understand each token, the model looks back at every token before it."},
  {say: "This looking-back step is called attention."},
  {say: "Double the document, and attention does four times the work."},
  {kind: "num", num: "8 billion", say: "comparisons for one 128,000-token document", sub: "each token compares itself with every token before it, and this repeats in all 1,024 attention heads of the model"},
  {say: "That's why long documents are slow and expensive."},

  {kind: "section", say: "The idea"},
  {say: "What if each token only looked at what matters?"},
  {say: "That's called sparse attention."},
  {say: "Older methods, like Big Bird, look at fixed spots."},
  {say: "Bigger Bird chooses where to look based on what the text says."},

  {kind: "section", say: "How we test it"},
  {say: "Skipping text is easy. Still understanding it is the hard part."},
  {say: "So we hide one fact inside a huge document."},
  {kind: "prompt", say: "Then we ask for it."},
  {say: "If our shortcut skips that fact, the model can't answer."},
  {say: "It only counts if the whole 7-digit number is right."},
  {say: "We compare against the normal model, on the exact same documents."},

  {kind: "section", say: "The road here"},
  {say: "For months, every shortcut we tried failed on long documents."},
  {say: "They worked at 65,000 tokens.", sub: "about a 200-page book"},
  {say: "They broke at 128,000 tokens.", sub: "about 400 pages: the most this model can read"},
  {say: "Even when we handed the model the answer, it still failed."},
  {say: "So finding the fact wasn't the real problem."},

  {kind: "img", img: F + "recall_layers.png", say: "We measured how blurry each layer's view of the document gets."},
  {say: "Small blur in the middle of the document adds up over 32 layers."},

  {kind: "section", say: "Our fix"},
  {say: "Each token now looks at four things."},
  {say: "One: the very beginning of the document."},
  {say: "Two: the nearby text, in full detail."},
  {say: "Three: a few hundred spots the question cares about."},
  {say: "Four: the question itself reads everything."},
  {kind: "img", img: F + "ablations.png", say: "Surprise: looking at fewer spots worked better than more."},
  {say: "No retraining. Same model, same weights."},

  {kind: "section", say: "Results"},
  {kind: "num", num: "30 / 30", say: "correct on 128,000-token documents"},
  {kind: "num", num: "28 / 30", say: "for the normal model", sub: "same documents; that 2-question gap is too small to count as a win"},
  {kind: "num", num: "1.9×", say: "faster to read the document"},
  {kind: "img", img: F + "scaling.png", say: "The longer the document, the bigger the speed gap."},
  {say: "Normal model: double the length, about three times the time."},
  {say: "Bigger Bird: double the length, two times the time."},
  {kind: "img", img: F + "loglog.png", say: "That's linear growth, not quadratic."},
  {kind: "img", img: F + "depth.png", say: "It works wherever the fact is hidden."},

  {kind: "section", say: "Harder tests"},
  {say: "What if there are lookalike facts, or many answers?"},
  {kind: "img", img: F + "tasks.png", say: "Up to 65,000 tokens, Bigger Bird matches or beats the normal model."},
  {kind: "prompt2", say: "Asked for all four numbers, Bigger Bird found all four. The normal model stopped at one."},

  {kind: "section", say: "Looking ahead"},
  {kind: "img", img: F + "attn_bench.png", say: "At a million tokens, our attention is 18 times faster."},
  {say: "That's speed only. This model can't read that far yet."},

  {kind: "section", say: "What it can't do yet"},
  {say: "On essay-like text at 128,000 tokens, it's behind.", sub: "11 out of 24 correct, vs 17 for the normal model"},
  {say: "These are test puzzles, not real-world questions yet."},
  {say: "It saves computing time, not memory."},

  {kind: "section", say: "Next"},
  {say: "Test on real-world questions."},
  {say: "Close the gap on natural text."},
  {say: "Try models that can read past 128,000 tokens."},

  {kind: "section", say: "How we got here"},
  {kind: "photo", img: A + "devcon_proposal.png", say: "February 2026: we pitched an idea at UTMIST DevCon."},
  {kind: "photo", img: A + "devcon_team.jpg", say: "This is the team."},
  {kind: "timeline", say: "Ten months, from hiring to results."},
  {kind: "timeline", tl: 0, say: "January to February: we hired the team.", sub: "first round of hiring"},
  {kind: "timeline", tl: 1, say: "February 7: our first public talk, at UTMIST DevCon."},
  {kind: "timeline", tl: 2, say: "February to March: we read the research.", sub: "literature review sessions"},
  {say: "We read a lot.", sub: "papers, explainer videos, and course notes"},
  {kind: "readlist", say: "Some of what shaped the project:"},
  {kind: "timeline", tl: 3, say: "April: our first experiments, on smaller BERT-style models."},
  {kind: "timeline", tl: 4, say: "Until July: we trained on Jerry's A100 GPU, with UTMIST's support."},
  {kind: "timeline", tl: 5, say: "July: Professor Michael Guerzhoy started supporting us."},
  {kind: "timeline", tl: 6, say: "July to September: we ran on Canada's national research computers.", sub: "Digital Research Alliance of Canada"},
  {kind: "timeline", tl: 7, say: "Late July: we moved to a modern AI model.", sub: "DeepSeek-R1-Distill-Llama-8B, the kind of model behind chat assistants"},
  {kind: "timeline", tl: 8, say: "September to October: faster GPUs on Modal, and our best results yet."},
  {kind: "partners", say: "Thank you to our compute partners"},

  {kind: "hero", say: "Thank you", corner: true},
];

const PROMPT = `The grass is green. The sky is blue. The sun is yellow. Here we go. …
<span class="dim">( 60,000 tokens of filler )</span>
… <span class="needle">The special magic golden-falcon is: 7606921.</span> …
<span class="dim">( 60,000 more tokens of filler )</span>
… <span class="q">What is the special magic golden-falcon?</span>`;
const PROMPT2 = `… <span class="needle">The special magic violet-thistle is: 3201885.</span> …
… <span class="needle">The special magic violet-thistle is: 7474932.</span> … <span class="dim">(two more)</span>
<span class="q">What are all values for the special magic violet-thistle?</span>

Bigger Bird:  3201885, 7474932, 1236801, 3579629
Normal model: 3201885.`;

const PARTNERS = [
  {img: "utmist_logo.png", cap: "Support and community from day one."},
  {img: "jerry.png", initial: "J", name: "Jerry", cap: "Lent us his A100 GPU until July."},
  {img: "drac.png", cap: "National research computing, July to September."},
  {img: "prof_guerzhoy.png", round: true, name: "Prof. Michael Guerzhoy", cap: "Supervision and access to research compute."},
];

const AGENDA = [
  ["The problem", "why long documents are expensive"],
  ["The idea", "look only at what matters"],
  ["How we test it", "one fact hidden in a huge document"],
  ["Results", "and what it can't do yet"],
  ["What's next", ""],
  ["How we got here", "the team, the timeline, our compute partners"],
];

const READLIST = [
  ["BigBird", "the paper we build on · arxiv.org"],
  ["Longformer", "arxiv.org"],
  ["FlashAttention", "arxiv.org"],
  ["Transformers, from first principles", "3Blue1Brown · YouTube"],
  ["Attention and transformers", "StatQuest · YouTube"],
  ["DeepSeek sparse attention, explained", "YouTube"],
  ["Mamba", "arxiv.org"],
  ["Longer context windows via positional interpolation", "arxiv.org"],
  ["Lightning Attention 2", "alphaxiv.org"],
  ["Permuted block-sparse attention", "arxiv.org"],
  ["Attention-level speculation", "U of T Scholaris"],
  ["How GPUs really spend their time", "horace.io"],
  ["CSC401 NLP course notes", "U of T"],
  ["and more …", ""],
];

const TIMELINE = [
  ["Jan–Feb", "Hiring the team"], ["Feb 7", "DevCon talk"], ["Feb–Mar", "Reading the research"],
  ["Apr", "First experiments on BERT-style models"], ["Until Jul", "Jerry's A100 GPU, with UTMIST"],
  ["Jul", "Prof. Guerzhoy's support"], ["Jul–Sep", "Digital Research Alliance of Canada"],
  ["Late Jul", "Switch to a chat-style model (R1-Llama-8B)"], ["Sep–Oct", "Modal GPUs, best results"]];

const deck = document.getElementById("deck");
S.forEach(s => {
  const el = document.createElement("section");
  el.className = "slide " + (s.kind === "photo" ? "k-img k-photo" : s.kind ? "k-" + s.kind : "");
  let html = "";
  if (s.corner) html += `<img class="corner" src="${A}utmist_logo.png" alt="UTMIST">`;
  if (s.kind === "timeline")
    html += `<div class="timeline">${TIMELINE.map(([d, t], j) =>
      `<div class="tl${s.tl === undefined ? "" : j === s.tl ? " on" : " off"}"><b>${d}</b><span>${t}</span></div>`).join("")}</div>`;
  if (s.kind === "hero")
    html += `<div class="row"><img src="${A}bigger_bird_logo.png" alt="Bigger Bird"><div><div class="big">Bigger Bird</div><div class="small">Content-Aware Sparse Transformer Attention</div></div></div>`;
  if (s.kind === "agenda")
    html += (s.say ? `<p class="say" style="margin:0 0 .7em">${s.say}</p>` : "") +
            `<div class="ov">` + AGENDA.map(([t, d], j) =>
              `<div class="oi"><span class="n">0${j + 1}</span><span class="t">${t}</span>${d ? `<span class="d">${d}</span>` : ""}</div>`).join("") + `</div>`;
  if (s.kind === "readlist")
    html += (s.say ? `<p class="say" style="margin:0 0 .9em">${s.say}</p>` : "") +
            `<div class="readlist">` + READLIST.map(([t, tag]) => `<div>${t}<span>${tag}</span></div>`).join("") + `</div>`;
  if (s.kind === "partners")
    html += (s.say ? `<p class="ptitle">${s.say}</p>` : "") + `<div class="pgrid">` + PARTNERS.map(p => {
      let v = p.text
        ? `<div class="pimg"><div class="wordmark">${p.text}</div></div>`
        : `<div class="pimg"><img class="${p.round || p.initial ? "face" : "plogo"}" src="${A}${p.img}" alt="${p.name || ""}"` +
          (p.initial ? ` onerror="this.outerHTML='<div class=&quot;pimg&quot;><div class=&quot;initial&quot;>${p.initial}</div></div>'"` : "") + `></div>`;
      return `<div class="p">${v}${p.name ? `<p class="pname">${p.name}</p>` : ""}<p class="pcap">${p.cap}</p></div>`;
    }).join("") + `</div>`;
  else if (s.img) html += `<img src="${s.img}" alt="">`;
  if (s.kind === "num") html += `<div class="num">${s.num}</div>`;
  if (s.kind === "prompt") html += `<div class="prompt">${PROMPT}</div>`;
  if (s.kind === "prompt2") html += `<div class="prompt">${PROMPT2}</div>`;
  if (s.say && !["partners", "readlist", "agenda"].includes(s.kind)) html += `<p class="say"${s.kind && s.kind.startsWith("prompt") ? ' style="font-size:2.4vw;margin-top:.7em"' : ""}>${s.say}</p>`;
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  el.innerHTML = html;
  deck.appendChild(el);
});

const slides = [...document.querySelectorAll(".slide")];
let i = Math.max(0, Math.min(slides.length - 1, parseInt(location.hash.slice(1) || "1") - 1));
const show = () => { slides.forEach((s, j) => s.classList.toggle("active", j === i));
                     document.getElementById("num").textContent = `${i + 1} / ${slides.length}`; location.hash = i + 1; };
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) i = Math.min(slides.length - 1, i + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) i = Math.max(0, i - 1);
  show();
});
document.addEventListener("click", e => { i = e.clientX > innerWidth / 2 ? Math.min(slides.length - 1, i + 1) : Math.max(0, i - 1); show(); });
show();
</script>
</body>
</html>
